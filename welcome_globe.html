<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}#stage{height:385px;position:relative;display:grid;place-items:center}canvas{width:100%;height:100%;display:block;position:absolute;inset:0}#fallback{color:#e8c98d;font:16px system-ui;text-align:center}</style></head><body><div id="stage"><canvas id="c"></canvas><div id="fallback"></div></div><script>
const cfg=__CONFIG__, c=document.querySelector('#c'), gl=c.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:true});
if(!gl){document.querySelector('#fallback').textContent='The rotating globe requires browser WebGL support.';}else{
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs=`precision highp float; uniform vec2 res;uniform float angle;uniform float bob;uniform sampler2D earth;
void main(){vec2 p=(gl_FragCoord.xy-res*.5)/min(res.x,res.y);p.y-=.035+bob;float r=.39;vec2 q=p/r;float d=length(q);float halo=exp(-pow((d-1.04)/.22,2.))*.15+exp(-d*d*1.8)*.11;vec4 col=vec4(.83,.59,.28,halo);if(d<1.01){float z=sqrt(max(0.,1.-dot(q,q)));vec3 n=vec3(q,z);float tilt=.38;float gy=n.y*cos(tilt)+n.z*sin(tilt);float gz=n.z*cos(tilt)-n.y*sin(tilt);float lon=atan(n.x,gz)+angle;float lat=asin(clamp(gy,-1.,1.));vec3 t=texture2D(earth,vec2(fract(lon/6.2831853+.5),.5-lat/3.14159265)).rgb;float lit=.48+.52*max(0.,dot(n,normalize(vec3(-.45,.55,.85))));vec3 rgb=t*lit;rgb+=vec3(.65,.43,.18)*pow(max(0.,1.-z),4.)*.10;float edge=1.-smoothstep(1.-2./(r*min(res.x,res.y)),1.,d);col=mix(col,vec4(rgb,1.),edge);}gl_FragColor=col;}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}let program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);gl.useProgram(program);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);let tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);let image=new Image();image.onload=()=>{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,image);let reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let start;function draw(t){if(start===undefined)start=t;let elapsed=reduce?0:(t-start)/1000;let dpr=Math.min(devicePixelRatio||1,3);let w=Math.round(c.clientWidth*dpr),h=Math.round(c.clientHeight*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}gl.viewport(0,0,w,h);gl.uniform2f(gl.getUniformLocation(program,'res'),w,h);gl.uniform1f(gl.getUniformLocation(program,'angle'),cfg.lon*Math.PI/180+elapsed*.085);gl.uniform1f(gl.getUniformLocation(program,'bob'),Math.sin(elapsed*.7)*.009);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw);}requestAnimationFrame(draw);};image.src='data:image/jpeg;base64,__TEXTURE__';}
</script></body></html>
