<!doctype html><html><head><style>
html,body{margin:0;background:transparent;color:#e8c98d;font:13px system-ui;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#stage{position:relative;height:490px}#stage.welcome{height:370px;background:radial-gradient(ellipse at 50% 76%,#b79a6640,transparent 49%),radial-gradient(ellipse at 30% 65%,#a69c8420,transparent 40%),radial-gradient(ellipse at 70% 65%,#b7a58b24,transparent 40%)}#stage.welcome:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 65%,#a78b5030,transparent 54%);pointer-events:none}#stage.welcome:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:70px;background:repeating-linear-gradient(0deg,transparent 0 3px,#c1a47435 4px 5px,transparent 6px 9px),radial-gradient(ellipse at 50% 0%,#bca06a55,transparent 65%);mask-image:radial-gradient(ellipse,black,transparent 70%);pointer-events:none}#tip{position:absolute;display:none;background:#091827ee;padding:8px;border:1px solid #c7a05c;border-radius:5px;pointer-events:none;max-width:220px}button{background:#152c40;color:#e8c98d;border:1px solid #7e6944;border-radius:5px;padding:6px 12px;margin:3px;cursor:pointer}#controls{text-align:center}</style></head><body><div id="stage"><canvas id="c"></canvas><div id="tip"></div></div><div id="controls"><button id="mode">Flat map</button><button id="plus">+</button><button id="minus">−</button><button id="reset">Reset globe</button><button id="spin">Pause rotation</button></div><script>
const cfg=__CONFIG__, stage=document.querySelector('#stage'), c=document.querySelector('#c'), ctx=c.getContext('2d'), tip=document.querySelector('#tip');if(cfg.welcome){stage.className='welcome';document.querySelector('#controls').hidden=true}let lon=cfg.lon*Math.PI/180,lat=cfg.lat*Math.PI/180,z=cfg.welcome?1:Math.max(0.7,cfg.zoom),flat=cfg.flat,spin=!flat&&matchMedia('(prefers-reduced-motion: no-preference)').matches,drag=false,px=0,py=0,markers=[],dirty=true;const tex=new Image();tex.src='data:image/jpeg;base64,__TEXTURE__';let data,tw,th;tex.onload=()=>{let t=document.createElement('canvas');tw=t.width=tex.width;th=t.height=tex.height;let x=t.getContext('2d');x.drawImage(tex,0,0);data=x.getImageData(0,0,tw,th).data;dirty=true};const rad=Math.PI/180,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function buttons(){document.querySelector('#mode').textContent=flat?'Globe view':'Flat map';document.querySelector('#spin').textContent=spin?'Pause rotation':'Rotate globe'}buttons();function draw(time){requestAnimationFrame(draw);if(!data)return;if(spin&&!drag&&!flat){lon+=.002;dirty=true}if(cfg.welcome)dirty=true;if(!dirty)return;dirty=false;let scale=Math.min(1,720/stage.clientWidth),w=Math.max(1,Math.round(stage.clientWidth*scale)),h=Math.max(1,Math.round(stage.clientHeight*scale));if(c.width!==w||c.height!==h){c.width=w;c.height=h}let R=Math.min(w,h)*.44*z,cx=w/2,cy=h/2+(cfg.welcome?(Math.sin(time/1500)*7-18)*scale:0),out=ctx.createImageData(w,h),d=out.data,sl=Math.sin(lat),cl=Math.cos(lat);for(let y=0;y<h;y++){for(let x=0;x<w;x++){let u=(x-cx)/R,v=(cy-y)/R,q=u*u+v*v,L,P,light;if(flat){let span=Math.PI/Math.max(.7,z);L=lon+(x-cx)/w*2*span;P=lat+(cy-y)/w*2*span;if(Math.abs(P)>Math.PI/2)continue;light=1}else{if(q>1)continue;let nz=Math.sqrt(1-q);P=Math.asin(clamp(v*cl+nz*sl,-1,1));L=lon+Math.atan2(u,nz*cl-v*sl);light=.43+.57*Math.max(0,-.35*u+.45*v+.82*nz)}let tx=((Math.floor((L/(2*Math.PI)+.5)*tw)%tw)+tw)%tw,ty=clamp(Math.floor((.5-P/Math.PI)*th),0,th-1),i=(ty*tw+tx)*4,j=(y*w+x)*4;d[j]=data[i]*light;d[j+1]=data[i+1]*light;d[j+2]=data[i+2]*light;d[j+3]=flat?255:Math.min(255,(1-Math.sqrt(q))*R*255)} }ctx.clearRect(0,0,w,h);ctx.putImageData(out,0,0);if(cfg.welcome){ctx.save();ctx.globalAlpha=.19;ctx.translate(0,cy+R+12*scale);ctx.scale(1,-.23);ctx.drawImage(c,0,0,w,h,0,-(cy+R),w,h);ctx.restore();}markers=[];for(const p of cfg.points){let P=p.lat*rad,L=p.lon*rad-lon;L=Math.atan2(Math.sin(L),Math.cos(L));let x,y;if(flat){x=cx+L*w/(2*Math.PI/Math.max(.7,z));y=cy-(P-lat)*w/(2*Math.PI/Math.max(.7,z))}else{let a=Math.cos(P)*Math.cos(L);if(Math.sin(P)*sl+a*cl<0)continue;x=cx+R*Math.cos(P)*Math.sin(L);y=cy-R*(Math.sin(P)*cl-a*sl)}ctx.fillStyle=p.color;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();if(p.symbol==='square')ctx.rect(x-4,y-4,8,8);else if(p.symbol==='diamond'){ctx.moveTo(x,y-6);ctx.lineTo(x+6,y);ctx.lineTo(x,y+6);ctx.lineTo(x-6,y);ctx.closePath()}else if(p.symbol==='star'){for(let k=0;k<10;k++){let a=k*Math.PI/5-Math.PI/2,r=k%2?4:9;ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a))}ctx.closePath()}else ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.stroke();markers.push({x,y,p})}}requestAnimationFrame(draw);new ResizeObserver(()=>dirty=true).observe(stage);
if(!cfg.welcome){c.onpointerdown=e=>{drag=true;spin=false;buttons();px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=c.onpointercancel=()=>drag=false;c.onpointermove=e=>{if(drag){lon-=(e.clientX-px)*.007/z;lat=clamp(lat+(e.clientY-py)*.007/z,-1.5,1.5);px=e.clientX;py=e.clientY;dirty=true;tip.style.display='none'}else{let b=c.getBoundingClientRect(),x=(e.clientX-b.left)*c.width/b.width,y=(e.clientY-b.top)*c.height/b.height,p=markers.find(m=>Math.hypot(m.x-x,m.y-y)<10);tip.style.display=p?'block':'none';if(p){tip.textContent=p.p.text;tip.style.left=Math.min(e.offsetX+8,stage.clientWidth-150)+'px';tip.style.top=Math.max(0,e.offsetY-40)+'px'}}};c.onwheel=e=>{e.preventDefault();spin=false;buttons();z=clamp(z*Math.exp(-e.deltaY*.001),.7,12);dirty=true};document.querySelector('#mode').onclick=()=>{flat=!flat;spin=false;buttons();dirty=true};document.querySelector('#plus').onclick=()=>{z=clamp(z*1.25,.7,12);dirty=true};document.querySelector('#minus').onclick=()=>{z=clamp(z/1.25,.7,12);dirty=true};document.querySelector('#reset').onclick=()=>{flat=false;z=1;lat=32*rad;lon=34*rad;spin=false;buttons();dirty=true};document.querySelector('#spin').onclick=()=>{flat=false;spin=!spin;buttons();dirty=true}}
</script></body></html>
